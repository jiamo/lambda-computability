name = "lambda_computability"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Start"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
# Mathlib's standard linter set is off: it enforces Mathlib's own style conventions.
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

[[lean_lib]]
name = "Start"

[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib.git"
rev = "v4.33.0"
