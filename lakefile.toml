name = "lambda_computability"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Start"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# `linter.style.header` enforces the Mathlib repository's own copyright-header
# convention, which does not apply to this project.
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

[[lean_lib]]
name = "Start"

[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib.git"
rev = "v4.33.0"
