      - "The completion is proved to have finite limits, and the embedding to preserve the terminal object and binary products."
      - "Every object of the completion is proved to be a quotient of an assembly: the canonical map from the base of a relation is the coequalizer of the two endpoints of its assembly of proofs, hence a regular epimorphism."
      - "Every morphism of the completion is factored as an epimorphism followed by a monomorphism."
    required_gates:
      - "python3 scripts/goal_state.py validate"
      - "python3 scripts/check_closure.py"
      - "lake build"

