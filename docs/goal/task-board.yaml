    title: "Dependent types: the calculus lambda-Pi, categories with attributes, and locally cartesian closed categories"
    latest_evidence: "docs/goal/evidence/M9-LAMBDAPI-LCCC.md"
    open_boundary: "Both sides are built, but the biequivalence is not claimed. Syntax: LambdaPiCwa.syntactic is a category with attributes whose types are the small types, LambdaPiCwa.weakPi its dependent product, and LambdaPiCwa.not_piStruct_weakPi shows eta fails. Semantics: the strictified model (Cwa.ofPullbacks) presents types by local universes, so substitution is strictly functorial, and a locally cartesian closed category carries there a dependent product with beta and eta (Cwa.piStructOfLccc) and a sum. Universes: Cwa.Universe, SmallPi, PiClosed and the weaker CodePi and CodeSigma are what an interpretation needs; LambdaPiUniv.univ makes star a universe in the syntactic model, and CwaUniv.universeOfHom makes every morphism a universe in the strictified model. Cwa.Universe.smallCwa extracts the model whose types are the codes, and the two syntactic models are isomorphic (LambdaPiUniv.smallModelIso). Models are a category (Cwa.Model.instCategory). A set-theoretic model is built (CwaTypeModel.model): over Type (u+1) the universe object is Type u, types are the small families, terms the dependent functions, closed under products (codePi) and sums (modelSigma). Initiality is proved: LambdaPi.interp_exists_unique interprets every derivable judgement in an arbitrary model with injective products, uniquely; LambdaPiInitial.mor packages it as a morphism of categories with attributes out of the syntactic model, with object part LambdaPiInitial.functor, and that morphism preserves the universe, the products over it and their codes (mor_preservesUniverse, mor_preservesSmallPi, mor_preservesPiClosed), comparing them as models of lambda-Pi. Not claimed: the biequivalence between models of lambda-Pi and locally cartesian closed categories, and closure of the universe of a general strictified model under the pushforward product on the nose (Cwa.Universe.PiClosed) - genuine extra structure, ruled out for a two-code universe of the standard model by CwaTypeNotClosed.not_piClosed and not_codePi."
    milestone: M9
    depends_on:
      - M9-STLC-CCC
    rank: 170
    exit_criteria:
