    terminal_statement: "Realizability.ExReg.cover_iff_isRegularEpi : a morphism of the completion is a regular epimorphism exactly when it is a cover, i.e. has a computable section up to the relation; Realizability.ExReg.regularEpi_imgFac : the first factor of the image factorization is a regular epimorphism; Realizability.ExReg.cover_of_isPullback and .regularEpi_isStableUnderBaseChange : covers are stable under base change; Realizability.ExReg.hasCoequalizer_of_isKernelPair : kernel pairs have coequalizers; Realizability.ExReg.instRegular : the completion is a regular category in the sense of CategoryTheory.Regular; Realizability.ExReg.Coeq.hasCoequalizer_of_isInternalEquiv : every internal equivalence relation of the completion has a coequalizer (Realizability.ExReg.Coeq.coeqCoforkIsColimit); Realizability.ExReg.NotExact.exists_internalEquiv_not_kernelPair and .kleene_exReg_not_exact : the completion is nevertheless not exact - over any algebra with three distinct elements, in particular over Kleene's first algebra, it carries an internal equivalence relation that is the kernel pair of no morphism"
