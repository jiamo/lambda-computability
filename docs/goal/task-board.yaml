    terminal_statement: "Realizability.ExReg.ERel is the category of pseudo-equivalence relations over the assemblies and tracked maps up to homotopy (Realizability.ExReg.instCategory); Realizability.ExReg.emb embeds the assemblies fully and faithfully (Realizability.ExReg.instFullEmb, .instFaithfulEmb) preserving the terminal object and binary products (.embTermIso, .embProdIso); the completion has finite limits (Realizability.ExReg.instHasFiniteLimits, from .prodFanIsLimit and .eqForkIsLimit); every object is a regular quotient of an assembly (Realizability.ExReg.quotIsColimit, .regularEpi_quot); and every morphism factors as an epimorphism followed by a monomorphism (Realizability.ExReg.imgFac_comp_imgIncl, .epi_imgFac, .mono_imgIncl)"
    latest_evidence: "docs/goal/evidence/M12-EFF-EXREG.md"
    # The open boundary of this task was the exactness of the completion, which is now settled:
    # Realizability.ExReg.Coeq.hasCoequalizer_of_isInternalEquiv gives the coequalizer of every
    # internal equivalence relation, and Realizability.ExReg.NotExact.exists_internalEquiv_not_kernelPair
    # shows the relation need not be the kernel pair of it, so the completion of *all* assemblies
    # is regular but not exact.  The remaining programme - the universal property among exact
    # categories, the topos structure, and the identification with the effective topos, for bases
    # restricted to the regular projectives - is beyond this task's exit criteria and is recorded
    # in the evidence file.
    open_boundary: ""
    milestone: M12
    depends_on: []
    rank: 920
    exit_criteria:
      - "Pseudo-equivalence relations in the category of assemblies, and morphisms between them up to homotopy, are defined and shown to form a category."
