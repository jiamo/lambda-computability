    title: "Dependent types: the calculus lambda-Pi, categories with attributes, and locally cartesian closed categories"
    latest_evidence: "docs/goal/evidence/M9-LAMBDAPI-LCCC.md"
    open_boundary: "Both sides are built, but the biequivalence is not claimed. Syntax: LambdaPiCwa.syntactic is a category with attributes whose types are the small types, LambdaPiCwa.weakPi its dependent product, and LambdaPiCwa.not_piStruct_weakPi shows eta fails. Semantics: the strictified model (Cwa.ofPullbacks) presents types by local universes, so substitution is strictly functorial, and a locally cartesian closed category carries there a dependent product with beta and eta (Cwa.piStructOfLccc). Universes: Cwa.Universe, SmallPi, PiClosed, CodePi and CodeSigma are what an interpretation needs; LambdaPiUniv.univ makes star a universe in the syntactic model and CwaUniv.universeOfHom makes every morphism one in the strictified model. Cwa.Universe.smallCwa extracts the model whose types are the codes, and the two syntactic models are isomorphic (LambdaPiUniv.smallModelIso). A set-theoretic model is built (CwaTypeModel.model): over Type (u+1) the universe is Type u, types the small families, terms the dependent functions, closed under products (codePi) and sums (modelSigma). Initiality is proved: LambdaPi.interp_exists_unique interprets every derivable judgement uniquely in any model with injective products, and LambdaPiInitial.mor packages it as a morphism of categories with attributes out of the syntax preserving the universe, its products and their codes (mor_preservesUniverse, mor_preservesSmallPi, mor_preservesPiClosed). Not claimed: the biequivalence with locally cartesian closed categories, and closure of the universe of a general strictified model under the pushforward product on the nose (Cwa.Universe.PiClosed) - extra structure, ruled out for a two-code universe of the standard model by CwaTypeNotClosed.not_piClosed and not_codePi. Its 1-categorical shadow is settled by M10-CWA-STRICT-FULL: strictification is full on underlying functors (Cwa.exists_pbCatHom_fnc) but not on the nose (Cwa.not_full_strictification), so the comparison is only up to isomorphism of types."
    milestone: M9
    depends_on:
      - M9-STLC-CCC
    rank: 170
    exit_criteria:
