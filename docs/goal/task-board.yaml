  - id: M9-LAMBDAPI-LCCC
    priority: P1
    status: BACKEND_PARTIAL
    track: theory/semantics
    title: "Dependent types: the calculus lambda-Pi, categories with attributes, and locally cartesian closed categories"
    latest_evidence: "docs/goal/evidence/M9-LAMBDAPI-LCCC.md"
    open_boundary: "Both sides are built, but the biequivalence is not claimed. Syntax: LambdaPiCwa.syntactic is a category with attributes whose types are the small types, LambdaPiCwa.weakPi its dependent product, and LambdaPiCwa.not_piStruct_weakPi shows eta genuinely fails. Semantics: the strictified model (Cwa.ofPullbacks) presents types by local universes, so substitution is strictly functorial, and a locally cartesian closed category carries there a dependent product with beta and eta (Cwa.piStructOfLccc) and a dependent sum. Universes: Cwa.Universe, SmallPi, PiClosed and the weaker CodePi and CodeSigma are what an interpretation needs; LambdaPiUniv.univ makes star a universe in the syntactic model, and CwaUniv.universeOfHom makes every morphism a universe in the strictified model. Cwa.Universe.smallCwa extracts the model whose types are the codes (inclusion smallMor, products smallWeakPiOfCodePi, sums smallSigmaOfCodeSigma); the two syntactic models are isomorphic (LambdaPiUniv.smallModelIso). Substitution of terms is functorial in both (Cwa.ExtCoherent) and models form a category (Cwa.Model.instCategory). A set-theoretic model is built (CwaTypeModel.model, modelPiNatural): over Type (u+1) the universe object is Type u, types are the small families (modelTyEquiv), terms the dependent functions (modelTmEquiv), and the universe is closed under products (codePi, the dependent function type, with beta, eta and piLam_sub) and sums (modelSigma). Not claimed: interpretation of the syntax into an arbitrary model with a universe (initiality), any comparison between syntax and an arbitrary model, and closure of the universe of a general strictified model under the pushforward product on the nose (Cwa.Universe.PiClosed). That closure is genuine extra structure: CwaTypeNotClosed.twoUniverse is a two-code universe of the standard model with products over its small types, and not_piClosed and not_codePi rule out both Cwa.Universe.PiClosed and the weaker Cwa.Universe.CodePi for it."
    milestone: M9
    depends_on:
      - M9-STLC-CCC
    rank: 170
    exit_criteria:
